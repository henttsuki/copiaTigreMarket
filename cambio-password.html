<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de Contraseña | Tigre Market</title>
    <link rel="stylesheet" href="cambio-password.css">
    <script src="cambio-password.js" defer></script>
</head>
<body>

    <main class="contenedor">
        <!-- Columna Izquierda: Marca y Logotipo -->
        <header class="container">
            <section class="text">
                <h1 class="title">Tiger Market</h1>
                <p class="subtitle">Compra y vende entre estudiantes universitarios</p>
            </section>
        </header>

        <!-- Columna Derecha: Tarjeta de Recuperación -->
        <section class="formulario">
            <h2>Cambio de contraseña</h2>
            <p>Ingresa tu correo electrónico institucional para continuar.</p>

            <form id="cambio-password-form">
                <label for="correo-login">Correo electrónico</label>
                <div class="input-container">
                    <input 
                        type="text" 
                        id="correo-login" 
                        name="correo" 
                        placeholder="ejemplo: juanita_23" 
                        autocomplete="off" 
                        pattern="[a-z0-9_]+" 
                        required
                    >
                    <span class="domain-fixed">@tecnaucalpan.mx</span>
                </div>

                <button type="submit">Enviar enlace a tu correo electrónico</button>

                <p class="nota">
                    ¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a>
                </p>
            </form>
        </section>
    </main>
