<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio de contraseña</title>
    <link rel="stylesheet" href="cambio-password.css">
</head>
<body>
    <header>
    <section class="texto">
        <h1 class="titulo">Tigre Market</h1>
        <p class="parrafo">Compra y vende entre estudiantes universitarios</p>
    </section>
    </header>

    <main class="container">

        <section class="cambio">
            <h2 class="h2"> Cambio de contraseña</h2>
            <p class="p">Ingrese su correo electronico institucional</p>
            <form id="cambio">
                <label for="correo">Correo electronico</label></br>
                <div class="input-cambio">
                    <input
                    type="text"
                    id="correo-login"
                    name="correo"
                    placeholder="ejemplo: juanita_23"
                    autocomplete="off"
                    pattern="[a-z0-9_]+"
                    required>
                    <span class="domain-fixed">@tecnaucalpan.mx</span>
                </div>
                <datalist id="dominios"></datalist>
        <div class="confirmacion">
            <label class="option">
                <input type="checkbox" id="correo" name="correo" required>
                Confirma tu correo electronico
            </label>
        </div>
        <button type="submit">Enviar link a tu correo electronico</button>
            </form>
        </section>
    </main>
    
</body>
</html>
